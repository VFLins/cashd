name: Upload cashd-core package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build cashd-core/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: cashd-core/dist
      - name: Upload Cashd Server
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "Upload cashd-server package"
          token: ${{ secrets.GH_TOKEN }}
      - name: Build Cashd Local
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "Build cashd-local"
          token: ${{ secrets.GH_TOKEN }}
